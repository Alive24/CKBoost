[functions]
# Functions at root level, not in dapp
directory = "netlify/functions"

[dev]
# Development server configuration
command = "next dev --port 3203"
targetPort = 3203
port = 9003
publish = "dapp"
functionsPort = 9993
autoLaunch = false

[[plugins]]
# Essential plugin for deploying Next.js sites on Netlify.
# It automatically configures redirects, serverless functions, and more.
package = "@netlify/plugin-nextjs"


# API redirects for cleaner URLs
[[redirects]]
from = "/api/telegram-authenticate"
to = "/.netlify/functions/telegram-authenticate"
status = 200

[[redirects]]
from = "/api/resolve-lock-script"
to = "/.netlify/functions/resolve-lock-script"
status = 200

[[redirects]]
from = "/api/achievement-validate"
to = "/.netlify/functions/achievement-validate"
status = 200

[[redirects]]
from = "/api/achievement-query"
to = "/.netlify/functions/achievement-query"
status = 200

[[redirects]]
from = "/api/streakBonus-query"
to = "/.netlify/functions/streakBonus-query"
status = 200

[[redirects]]
from = "/api/streakBonus-validate"
to = "/.netlify/functions/streakBonus-validate"
status = 200

[[redirects]]
from = "/api/staff-approve-submissions"
to = "/.netlify/functions/staff-approve-submissions"
status = 200

[[redirects]]
from = "/api/tipping-release"
to = "/.netlify/functions/tipping-release"
status = 200

[[redirects]]
from = "/api/social-interactions"
to = "/.netlify/functions/social-interactions"
status = 200

[[redirects]]
from = "/api/verification/*"
to = "/.netlify/functions/verification-api/:splat"
status = 200

# Environment variables (set in Netlify dashboard)
# TELEGRAM_BOT_TOKEN=your_bot_token
# TELEGRAM_BOT_USERNAME=your_bot_username  
# NEXT_PUBLIC_CKB_RPC_URL=https://testnet.ckb.dev
# NEXT_PUBLIC_CKB_INDEXER_URL=https://testnet.ckb.dev/indexer
# NEXT_PUBLIC_SSRI_EXECUTOR_URL=http://localhost:9090
